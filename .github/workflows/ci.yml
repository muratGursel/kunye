name: Test ve paket

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pil python3-qrcode python3-pytest fonts-dejavu-core libzbar0
          pip install --user --break-system-packages pyzbar
      - name: Testler
        run: python3 -m pytest -v

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Paketi oluştur
        id: build
        run: echo "deb=$(sh packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"
      - name: Paketi kur ve dene
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "${{ steps.build.outputs.deb }}"
          kunye --version
          kunye sablonlar
          kunye onizle bileklik-yetiskin --ornek -o /tmp/bileklik.png
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); import kunye.gui.window"
      - uses: actions/upload-artifact@v4
        with:
          name: kunye-deb
          path: dist/*.deb
      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
